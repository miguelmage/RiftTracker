<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RiftTracker - Registro</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

<header class="navbar">
    <div class="logo">⚡ RIFT<span>TRACKER</span></div>
    <nav>
        <a href="index.html">Ligas</a>
        <a href="#">Buscador SoloQ</a>
        <a href="login.html" class="btn-login-nav">Iniciar Sesión</a>
    </nav>
</header>

<div class="login-container">
    <div class="login-card">
        <h2>CREAR CUENTA</h2>
        <p class="subtitle">Regístrate para guardar tu perfil</p>

        <div id="error-msg" class="error-banner hidden"></div>
        <div id="success-msg" class="success-banner hidden"></div>

        <form id="registro-form">
            <div class="form-group">
                <label for="username">Nombre de Invocador</label>
                <input type="text" id="username" placeholder="Faker123" required>
            </div>

            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" placeholder="ejemplo@rifttracker.com" required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-hextech">REGISTRARSE</button>
        </form>

        <p class="auth-switch">¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a></p>
    </div>
</div>

<script src="js/auth.js"></script>
</body>
</html>
