<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RiftTracker - Mi Perfil</title>

    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/perfil.css">

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

<header class="navbar">
    <div class="logo">⚡ RIFT<span>TRACKER</span></div>

    <nav>
        <a href="index.html">Ligas</a>
        <a href="#">Buscador SoloQ</a>
        <a href="login.html" class="active btn-login-nav">Iniciar Sesión</a>
    </nav>
</header>

<main class="perfil-container">

    <section class="perfil-header">
        <p class="perfil-etiqueta">CUENTA DE INVOCADOR</p>
        <h1>MI PERFIL</h1>
        <p>Gestiona tu información personal de RiftTracker.</p>
    </section>

    <section class="perfil-card">

        <div class="perfil-identidad">
            <div class="perfil-avatar">🛡️</div>

            <div>
                <h2 id="perfil-username">Cargando...</h2>
                <span id="perfil-rol" class="perfil-rol">USUARIO</span>
            </div>
        </div>

        <div class="perfil-divider"></div>

        <div id="perfil-error" class="perfil-message error hidden"></div>
        <div id="perfil-success" class="perfil-message success hidden"></div>

        <form id="perfil-form">

            <h3>INFORMACIÓN PERSONAL</h3>

            <div class="perfil-grid">

                <div class="perfil-field">
                    <label for="username">Nombre de usuario</label>
                    <input
                            type="text"
                            id="username"
                            name="username"
                            maxlength="50"
                            required
                    >
                </div>

                <div class="perfil-field">
                    <label for="email">Correo electrónico</label>
                    <input
                            type="email"
                            id="email"
                            name="email"
                            required
                    >
                </div>

                <div class="perfil-field">
                    <label for="rol">Tipo de cuenta</label>
                    <input
                            type="text"
                            id="rol"
                            disabled
                    >
                </div>

                <div class="perfil-field">
                    <label for="created-at">Fecha de registro</label>
                    <input
                            type="text"
                            id="created-at"
                            disabled
                    >
                </div>

            </div>

            <div class="perfil-actions">
                <button type="submit" class="btn-guardar">
                    GUARDAR CAMBIOS
                </button>

                <a href="index.html" class="btn-volver">
                    VOLVER A LAS LIGAS
                </a>
            </div>

        </form>

    </section>

</main>

<script src="js/auth.js"></script>
<script src="js/perfil.js"></script>

</body>
</html>
